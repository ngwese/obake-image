# obake-ravenna stream configuration.
# Copied to /home/obake/.config/obake-ravenna/config.toml when missing.
# An empty [[source]] / [[sink]] list transmits nothing and joins no groups.
#
# [graph]
# rate = 48000
# node_group = "obake.ravenna"
#
# # Continuous SLAVE dwell before sources/sinks come up (ms).
# # Default 2000 when omitted; 0 = bring up on the lock edge.
# # [ptp]
# # lock_hold_ms = 2000
#
# # RTP frames per packet (not the PipeWire quantum).
# [packet]
# frames = 48
#
# [multicast]
# address = "239.1.60.50"
# base_port = 5004          # even; source i uses base_port + 2*i
# ttl = 15                  # optional (default 15)
#
# [[source]]
# name = "obake-out-1"
# channels = 8
# format = "L24"            # L16 or L24
# # payload = 104           # optional; default 96 + channels
# # address = "239.1.60.51" # optional pin
# # port = 5010             # optional even pin
#
# [[sink]]
# name = "obake-in-1"
# device = "Anubis"         # DNS-SD instance name
# stream = "Anubis_Combo 1/2"
