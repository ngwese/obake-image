# AES67 media-profile client (also used by RAVENNA PTP peers).
# Domain 0, E2E, UDPv4, DSCP, media-oriented intervals. Never wins BMCA.
# Replace REPLACE_WITH_INTERFACE with the qdl interface name before enabling.
[global]
clientOnly			1
priority1			255
priority2			255
domainNumber			0
network_transport		UDPv4
delay_mechanism			E2E
time_stamping			hardware
dscp_event			46
dscp_general			34
logAnnounceInterval		0
logSyncInterval			-3
logMinDelayReqInterval		-3
announceReceiptTimeout		3
uds_address			/run/ptp4l/ptp4l
uds_ro_address			/run/ptp4l/ptp4l.ro

[REPLACE_WITH_INTERFACE]
