# Allow per-user authorized keys outside the (read-only) home directory, so SSH
# access can be provisioned into the image or the persist partition.
AuthorizedKeysFile .ssh/authorized_keys /etc/ssh/authorized_keys.d/%u

# OpenSSH 9.8+ penalizes a source after failed authentications and then refuses
# it with "Not allowed at this time". These hosts are updated and administered
# deliberately on trusted networks, so disable the penalty to keep SSH
# behaviour predictable.
PerSourcePenalties no
