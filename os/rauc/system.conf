[system]
compatible=obake
bootloader=efi
mountprefix=/run/rauc
statusfile=/persist/rauc/status

[keyring]
path=/etc/rauc/ca.cert.pem

# Root slots: the ext4 root filesystems. RAUC's efi backend selects a slot
# through EFI BootOrder/BootNext and matches the slot by the EFI boot entry
# whose description equals `bootname` (A/B). Those entries are created and kept
# current by obake-efi-entries.service and point at the slot's UKI on the ESP.
[slot.rootfs.0]
device=/dev/disk/by-partlabel/OBKA_ROOT_A
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/OBKA_ROOT_B
type=ext4
bootname=B

# Boot slots: the per-slot UKIs on the shared ESP, written as raw images so the
# kernel and userspace of a slot are updated together. They have no bootname, so
# the bootloader backend does not manage them directly.
[slot.boot.0]
parent=rootfs.0
device=/boot/efi/EFI/Linux/obake-a.efi
type=raw

[slot.boot.1]
parent=rootfs.1
device=/boot/efi/EFI/Linux/obake-b.efi
type=raw
