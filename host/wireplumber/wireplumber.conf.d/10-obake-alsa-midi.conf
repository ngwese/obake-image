# Prefer UMP (MIDI 2.0 packets) on the ALSA sequencer bridge. Mid-1.6.x
# defaults to MIDI 1.0 again; the qdl kernel enables USB MIDI 2.0, so the
# factory image opts back into UMP. Override under
# /home/obake/.config/wireplumber/wireplumber.conf.d/ if needed:
#   monitor.alsa-midi.properties = { api.alsa.seq.ump = false }
monitor.alsa-midi.properties = {
  api.alsa.seq.ump = true
}
