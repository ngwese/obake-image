# ALSA period matches the graph quantum. Card ids are the same names
# jackd used as hw:CARD= (ADAT, MixPre "II", USBPre2). No RAVENNA profile.
# Suspend stays off for every ALSA node so an idle card is not released.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
      }
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        api.alsa.card.id = "ADAT"
      }
      {
        node.name = "~alsa_output.*"
        api.alsa.card.id = "ADAT"
      }
      {
        node.name = "~alsa_input.*"
        api.alsa.card.id = "II"
      }
      {
        node.name = "~alsa_output.*"
        api.alsa.card.id = "II"
      }
      {
        node.name = "~alsa_input.*"
        api.alsa.card.id = "USBPre2"
      }
      {
        node.name = "~alsa_output.*"
        api.alsa.card.id = "USBPre2"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size = 128
        api.alsa.period-num = 3
        audio.rate = 48000
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
