# Factory clock for the obake graph. One quantum for every card.
# The upstream VM rule raises min-quantum when cpu.vm.name is set;
# the rule below puts 128 back so a QEMU guest matches the hardware clock.
context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 48000 ]
    default.clock.quantum       = 128
    default.clock.min-quantum   = 128
    default.clock.max-quantum   = 128
}

context.properties.rules = [
    {
        matches = [
            { cpu.vm.name = "~.*" }
        ]
        actions = {
            update-props = {
                default.clock.rate        = 48000
                default.clock.quantum     = 128
                default.clock.min-quantum = 128
                default.clock.max-quantum = 128
            }
        }
    }
]
